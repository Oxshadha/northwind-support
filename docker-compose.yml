# SQL Server for local development only. The password below is a throwaway local
# placeholder - never commit a real credential.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: supportdesk-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_Dev_Password1}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - supportdesk-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # The API, built from apps/api/Dockerfile. Everything environment-specific is passed in here
  # at run time - nothing is baked into the image. The defaults are local fixtures, like the
  # SA password above; set real values in .env (see .env.example).
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: supportdesk-api
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${API_ENVIRONMENT:-Development}"
      # Reaches SQL Server by its service name on the compose network.
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=SupportDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_Dev_Password1};TrustServerCertificate=True;Encrypt=False"
      # A "dev-only-" key is refused outside Development, so this default cannot reach production.
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-dev-only-compose-signing-key-for-local-containers-only}"
      # On an empty volume: apply the migrations and seed the demo data and dev credentials.
      Database__MigrateAndSeedOnStartup: "${API_MIGRATE_AND_SEED:-true}"

volumes:
  supportdesk-sql:
